version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mini_lcs_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mini_lcs
      MYSQL_USER: lcs_user
      MYSQL_PASSWORD: lcs_password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: mini_lcs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
